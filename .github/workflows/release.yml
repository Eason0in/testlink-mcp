name: Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type RELEASE to publish after acceptance"
        required: true

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  publish:
    if: inputs.confirm_release == 'RELEASE'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run eval && npm run build
      - run: npm publish --provenance --access public
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/easonlin/testlink-mcp:1.0.0
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/easonlin/testlink-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish server.json
