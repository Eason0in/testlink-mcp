name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24.19.0", "26.7.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm used by the lockfile
        run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run eval
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - run: npm pack --dry-run
      - name: Smoke installed npm package
        if: matrix.node == '24.19.0'
        run: |
          package_dir="$RUNNER_TEMP/testlink-mcp-package"
          mkdir -p "$package_dir"
          package_name="$(npm pack --pack-destination "$package_dir" --silent)"
          npm install --ignore-scripts --prefix "$package_dir/install" "$package_dir/$package_name"
          node tests/smoke-installed.mjs "$package_dir/install/node_modules/.bin/testlink-mcp"
      - name: Validate MCP Registry metadata
        if: matrix.node == '24.19.0'
        run: |
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher validate server.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Clean multi-architecture build
        run: docker buildx build --no-cache --platform linux/amd64,linux/arm64 --output type=oci,dest=/tmp/testlink-mcp.oci.tar .
      - name: Build runtime images
        run: |
          docker buildx build --platform linux/amd64 --load -t testlink-mcp:ci-amd64 .
          docker buildx build --platform linux/arm64 --load -t testlink-mcp:ci-arm64 .
      - name: Runtime MCP smoke
        run: |
          for image in testlink-mcp:ci-amd64 testlink-mcp:ci-arm64; do
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | docker run --rm -i -e TESTLINK_DEMO_MODE=true "$image" | grep -q '"serverInfo"'
          done
      - name: Reject high and critical runtime vulnerabilities
        run: |
          mkdir -p "$HOME/.cache/trivy"
          for image in testlink-mcp:ci-amd64 testlink-mcp:ci-arm64; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
